play.i18n.langs=["en"]

# Development secret (production secret will override this)
play.http.secret.key="^]_xhU=nSD^/>^8?QEIQo_ueU1dRgk;4tD4MlKnnAI/Ce5uPE[?g3@4CbP/1jTDV"

# Let OS manage its PID file
pidfile.path = "/dev/null"

url.base="https://raw.githubusercontent.com/obruchez/olivier-bruchez-name/master/data/"
url.booknotes="https://raw.githubusercontent.com/obruchez/olivier-bruchez-name/master/data/books/"
url.coursecertificates="https://raw.githubusercontent.com/obruchez/olivier-bruchez-name/master/data/courses/"

# Comments on blog posts (Disqus); the posts that came from Blogger keep the comments they had there
disqus.shortname="obruchez"

# Following properties in local/production configuration:
#  - reload.token (enables /reload?token=..., which refreshes all the data immediately)
#  - analytics.measurementid (Google Analytics 4, "G-..."; no tracking without it)

play.filters.enabled += "play.filters.csp.CSPFilter"

# Everything (CSS, JS, fonts) is served from this site, except Google Analytics when it is configured
# and Disqus when the comments of a blog post are opened;
# inline style attributes are used for ratings and charts
play.filters.csp.directives {
  default-src = "'self'"
  script-src = "'self' https://*.googletagmanager.com https://*.disqus.com https://*.disquscdn.com"
  connect-src = "'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.disqus.com"
  style-src = "'self' 'unsafe-inline'"
  img-src = "'self' https:"
  # the videos embedded in blog posts, and their comments (Disqus)
  frame-src = "https://www.youtube-nocookie.com https://disqus.com"
  # the audio files of a blog post
  media-src = "'self' https://s3.amazonaws.com"
  object-src = "'none'"
  base-uri = "'self'"
  frame-ancestors = "'none'"
}

# Only the real host names: absolute URLs (sitemap, feed, robots.txt) are built from the Host header
play.filters.hosts {
  allowed = ["olivier.bruchez.name", "localhost", "127.0.0.1"]
}
