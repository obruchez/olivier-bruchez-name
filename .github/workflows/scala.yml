name: Scala CI
on:
  push:
    branches: [ master, redesign ]
  pull_request:
    branches: [ master, redesign ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install SBT
        uses: sbt/setup-sbt@v1

      - name: Package for Debian
        run: sbt debian:packageBin
