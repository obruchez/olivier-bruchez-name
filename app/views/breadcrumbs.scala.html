@(page: Page)

@defining(controllers.Breadcrumbs.links(page)) { links =>
  @* Only worth showing below the top level: Home / Section / Page *@
  @if(links.size > 2) {
    <nav aria-label="Breadcrumb">
      <ol class="crumbs">
        @links.init.map { link =>
          <li>@link.url match {
            case Some(url) => { <a href="@url">@link.name</a> }
            case None => { @link.name }
          }</li>
        }
      </ol>
    </nav>
  }
}
