@(rating: Option[Double])

@rating.map { rating =>
  @defining(BigDecimal(rating).underlying.stripTrailingZeros.toPlainString) { value =>
    <span class="rating" role="img" aria-label="Rated @value out of 5" style="--rating: @value">
      <span class="rating-stars" aria-hidden="true"></span>
      <span class="rating-value" aria-hidden="true">@value</span>
    </span>
  }
}
