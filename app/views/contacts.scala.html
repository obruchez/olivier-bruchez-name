@(contacts: Contacts)

@main(Sitemap.contacts) {
  @contacts.introduction.map { introduction =>
    <div class="lead-in"><p>@introduction.fullVersion.html</p></div>
  }

  <dl class="contact-list">
    @contacts.contacts.map { contact =>
      <div>
        <dt>@contact.name</dt>
        <dd><a href="@contact.url">@contact.urlDescription</a></dd>
      </div>
    }
  </dl>
}
